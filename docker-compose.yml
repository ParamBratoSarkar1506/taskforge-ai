services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  chroma:
    image: chromadb/chroma:0.5.23
    volumes: [chroma-data:/chroma/chroma]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskforge
      SPRING_DATASOURCE_USERNAME: taskforge
      SPRING_DATASOURCE_PASSWORD: taskforge_dev_only
      TASKFORGE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-change-me}
      TASKFORGE_AI_PROVIDER: ${TASKFORGE_AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    environment:
      BACKEND_UPSTREAM: backend:8080
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres-data:
  chroma-data:
